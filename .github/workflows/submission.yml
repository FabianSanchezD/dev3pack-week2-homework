name: Validar entrega
on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
permissions:
  contents: read
  pull-requests: read
jobs:
  folder:
    runs-on: ubuntu-latest
    steps:
      # Solo revisa que todos los archivos del PR estén en submissions/USUARIO/.
      - uses: actions/github-script@v7
        with:
          script: |
            const user = context.payload.pull_request.user.login;
            const folder = `submissions/${user}/`;
            const files = await github.paginate(github.rest.pulls.listFiles, {
              ...context.repo, pull_number: context.issue.number, per_page: 100,
            });
            const outside = files.map(f => f.filename).filter(name => !name.startsWith(folder));
            if (outside.length > 0) {
              core.setFailed(`Solo podés cambiar archivos dentro de ${folder}. Fuera de lugar:\n${outside.join('\n')}`);
            } else {
              core.info(`Formato válido: todo está en ${folder}. El código se revisa a mano.`);
            }
