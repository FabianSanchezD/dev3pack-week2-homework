name: Validar entrega
on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
permissions:
  contents: read
  pull-requests: read
jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      # Se carga la regla desde el commit base; el PR no puede cambiar su propio validador.
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.base.sha }}
      - uses: actions/github-script@v7
        with:
          script: |
            const { validateSubmission } = require(`${process.env.GITHUB_WORKSPACE}/scripts/submission-policy.cjs`);
            const files = await github.paginate(github.rest.pulls.listFiles, {
              ...context.repo, pull_number: context.issue.number, per_page: 100,
            });
            try {
              validateSubmission(files, context.payload.pull_request.user.login);
              core.info('Formato válido. La corrección técnica y conceptual se revisa por separado.');
            } catch (error) {
              core.setFailed(error.message);
            }
